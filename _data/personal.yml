intro:
  title: Hello!
  body: >
    I am a PhD student in the [Department of Mathematics](https://www.math.uwo.ca/) at the University of Western Ontario.
    My supervisor is [Dr. Hristo Sendov](https://www.uwo.ca/stats/people/bios/hristo-sendov.html).
    I completed my M.Sc. in Pure Mathematics at Western (2024-2025) and my B.Sc. in Information and Computing Science at the School of Sciences (now the [School of Mathematics and Statistics](http://maths.whut.edu.cn/english/)) at Wuhan University of Technology (2020-2024).

    You can find my CV [here](/assets/CV_Mengxu.pdf).
