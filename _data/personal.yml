intro:
  title: Hello!
  body: >
    I am a PhD student in the [Department of Mathematics](https://www.math.uwo.ca/) at the [University of Western Ontario](https://www.uwo.ca/index.html).
    My supervisor is [Dr. Hristo Sendov](https://www.uwo.ca/stats/people/bios/hristo-sendov.html).
    I completed my M.Sc. in Pure Mathematics at Western (2024-2025) under the supervision of [Dr. Martin Pinsonnault](https://mpinsonnault.github.io/), and my B.Sc. in Information and Computing Science at the School of Sciences (now the [School of Mathematics and Statistics](http://maths.whut.edu.cn/english/)) at [Wuhan University of Technology](https://english.whut.edu.cn/) (2020-2024).
    <br><br>
    My research interests lie primarily in [Matrix Analysis](https://en.wikipedia.org/wiki/Matrix_analysis).
    <br><br>
    You can find my CV [here](/assets/Curriculum_Vitae_Mengxu.pdf).
